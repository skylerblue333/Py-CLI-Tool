name: artifact-cli-ci

on:
  push:
    branches: [main, "product/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install verification dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q cli.py tests
      - name: Lint
        run: ruff check cli.py tests
      - name: Tests
        run: pytest -q
      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt
      - name: CLI smoke test
        run: python cli.py health | grep -q '"status":"ok"'
      - name: Build image
        run: docker build -t sky-artifact-cli:ci .
      - name: Verify non-root image
        run: test "$(docker run --rm --entrypoint=id sky-artifact-cli:ci -u)" != "0"
